# Clean up QRMI per-job credential directories older than 7 days.
# Files are normally deleted by the SPANK epilog; this is a safety net
# for jobs that were OOM-killed or left orphaned dirs on node failure.
# 7d chosen to cover multi-day HPC allocations without leaving stale dirs
# indefinitely. Cost of stale tmpfs dirs is negligible.
d /run/qrmi 0711 root root -
D /run/qrmi 0711 root root 7d
