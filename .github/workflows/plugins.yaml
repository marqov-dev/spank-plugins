---
name: Check Slurm Plugins
on:
  workflow_dispatch:  # Allows manual trigger from GitHub UI
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches:
      - main
    paths:
      - plugins/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-scope:
    name: CI change scope
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/github-script@v7
        id: scope
        with:
          script: |
            let files;
            if (context.eventName === 'push' && typeof context.ref === 'string'
                && context.ref.startsWith('refs/heads/') && !context.payload.forced && !context.payload.deleted
                && typeof context.payload.before === 'string' && /^[a-f0-9]{40}$/.test(context.payload.before)
                && !/^0+$/.test(context.payload.before)) {
              const comparison = await github.rest.repos.compareCommits({
                owner: context.repo.owner, repo: context.repo.repo,
                base: context.payload.before, head: context.sha
              });
              // A compare API diff is safe to classify only for a normal forward push.
              if (comparison.data.status !== 'ahead') {
                core.setOutput('code', 'true');
                return;
              }
              files = comparison.data.files;
              if (!Array.isArray(files) || !files.length || files.length >= 300) {
                core.setOutput('code', 'true');
                return;
              }
            } else if (context.eventName !== 'pull_request') {
              core.setOutput('code', 'true');
              return;
            } else {
              files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.issue.number, per_page: 100
              });
            }
            // A truncated or empty file list must never suppress executable checks.
            if (!files.length || (context.eventName === 'pull_request' && files.length !== context.payload.pull_request.changed_files) || files.some(file => typeof file.filename !== 'string' || !file.filename || !['added', 'removed', 'modified', 'renamed', 'copied', 'changed', 'unchanged'].includes(file.status) || (file.status === 'renamed' && (typeof file.previous_filename !== 'string' || !file.previous_filename)))) {
              throw new Error('Incomplete pull request file list');
            }
            const docsOnly = path => /^(README|CHANGELOG|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY|LICENSE)(\.(md|rst|txt))?$/i.test(path)
              || (/^(docs|doc)\//.test(path) && /\.(md|rst|txt)$/i.test(path)
                  && !/(^|\/)(tests?|fixtures?|config|requirements)(\/|\.)/i.test(path));
            core.setOutput('code', String(!files.every(file => docsOnly(file.filename)
              && (!file.previous_filename || docsOnly(file.previous_filename)))));

  build_lint_test:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.ci-scope.result != 'success' || needs.ci-scope.outputs.code != 'false')
    needs: ci-scope
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change classification
        if: needs.ci-scope.result != 'success' || needs.ci-scope.outputs.code != 'true'
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@v4.1.4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy
          sudo apt-get install -y libssl3 libssl-dev libzip-dev pax-utils
          sudo apt-get install -y slurm-wlm slurm-wlm-basic-plugins libslurm-dev

      - name: Install pkg-config
        run: sudo apt-get install -y pkg-config

      - name: Set Toolchain
        # https://github.com/dtolnay/rust-toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build skeleton
        working-directory: plugins/skeleton
        run: |
          mkdir build
          pushd build
          cmake .. -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          make
          popd

      - name: Run clang-tidy (skeleton)
        working-directory: plugins/skeleton
        run: |
          clang-tidy *.c -p ./build --checks=-*,modrnize-*,readability-*,performance-*,portability-*,-readability-magic-numbers,-readability-identifier-length  -header-filter=.*

      - name: Build spank_qrmi
        working-directory: plugins/spank_qrmi
        run: |
          mkdir build
          pushd build
          cmake .. -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          make
          readelf -p .version_info spank_qrmi.so
          strings spank_qrmi.so | grep SPANK_QRMI_BUILD_VERSION
          popd

      - name: Run clang-tidy (spank_qrmi)
        working-directory: plugins/spank_qrmi
        run: |
          clang-tidy *.c -p ./build --checks=-*,modrnize-*,readability-*,performance-*,portability-*,-readability-magic-numbers,-readability-identifier-length  -header-filter=.* -- -Ibuild/deps/src/QRMI -Ibuild/generated

      - name: Test spank_qrmi
        working-directory: plugins/tests/metadata
        run: |
          mkdir build
          pushd build
          cmake .. -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          make
          ./test ../../../spank_qrmi/build/spank_qrmi.so
          popd

      - name: Checkout QRMI repository
        uses: actions/checkout@v4.1.4
        with:
          repository: qiskit-community/qrmi
          ref: main
          path: external/qrmi

      - name: Build spank_qrmi (w/QRMI_ROOT)
        working-directory: plugins/spank_qrmi
        run: |
          pushd build
          rm -rf *
          cmake .. -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DQRMI_ROOT=$GITHUB_WORKSPACE/external/qrmi
          make
          readelf -p .version_info spank_qrmi.so
          strings spank_qrmi.so | grep SPANK_QRMI_BUILD_VERSION
          popd

      - name: Test spank_qrmi (w/QRMI_ROOT)
        working-directory: plugins/tests/metadata
        run: |
          pushd build
          rm -rf *
          cmake .. -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          make
          ./test ../../../spank_qrmi/build/spank_qrmi.so
          popd
